[project]
name = "defillama-mcp"
version = "1.0.0"
description = "Local, keyless Model Context Protocol (MCP) server for DefiLlama over the free public REST APIs (stdio transport)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "defillama", "defi", "analytics", "llm"]
dependencies = [
    "fastmcp>=2.11",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.scripts]
defillama-mcp = "server:main"

[project.urls]
Homepage = "https://github.com/DefiLlama/DefiLlama-Server"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]

[tool.uv]
package = true
