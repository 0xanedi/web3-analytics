name: Deploy dashboards to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "dashboards/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboards
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboards/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (typecheck + vite)
        run: npm run build

      # Requires Pages to be enabled once with source "GitHub Actions"
      # (Settings -> Pages -> Build and deployment -> Source). The default
      # GITHUB_TOKEN cannot create the Pages site, so this is a one-time
      # manual step; after that the workflow deploys on every push.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboards/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
